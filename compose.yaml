# ─────────────────────────────────────────────────────────────────────────────
# CampusConnect Microservices — Lab 7 — Docker Compose Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Lab 7 adds an API Gateway as the single public entry point.
# Only the gateway's port (8080) is exposed to the host.
# User, Product, and Order services are reachable ONLY inside campus-network.
# Service URLs are passed as environment variables (config-based service discovery).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API Gateway (Lab 7) ───────────────────────────────────────────────────
  # Single public entry point. Routes /users → user-service,
  # /products → product-service, /orders → order-service.
  # This is the ONLY service with a host-exposed port.
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"          # ← ONLY the gateway is publicly reachable
    environment:
      PORT: 8080
      # ── Service Discovery: URLs from env vars, never hard-coded ───────────
      USER_SERVICE_URL:    http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL:   http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network
    restart: unless-stopped

  # ── User Service ──────────────────────────────────────────────────────────
  # No host port exposure in Lab 7 — only reachable via the gateway
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    # ports section removed: service is internal-only in Lab 7
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/campusconnect-users
    depends_on:
      - mongodb
    networks:
      - campus-network
    restart: unless-stopped

  # ── Product Service ───────────────────────────────────────────────────────
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    # ports section removed: service is internal-only in Lab 7
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/campusconnect-products
    depends_on:
      - mongodb
    networks:
      - campus-network
    restart: unless-stopped

  # ── Order Service ─────────────────────────────────────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    # ports section removed: service is internal-only in Lab 7
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongodb:27017/campusconnect-orders
      USER_SERVICE_URL:    http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      - mongodb
      - user-service
      - product-service
    networks:
      - campus-network
    restart: unless-stopped

  # ── MongoDB (Shared Instance — Database-per-Service Isolation) ────────────
  mongodb:
    image: mongo:latest
    container_name: mongodb
    # No host port exposure — only reachable from within campus-network
    volumes:
      - campus-mongo-data:/data/db
    networks:
      - campus-network
    restart: unless-stopped

# ── Named Volume for MongoDB Persistence ────────────────────────────────────
volumes:
  campus-mongo-data:
    name: campus-mongo-data

# ── Shared Docker Bridge Network ───────────────────────────────────────────
networks:
  campus-network:
    name: campus-network
    driver: bridge
